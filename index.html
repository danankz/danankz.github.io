
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sam's Journal</title>
  <style>
    :root {
      --cream: #F5F0E5;
      --brown: #493528;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: Georgia, serif;
    }
    nav {
      position: relative;
      z-index: 2;
      background: var(--cream);
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      padding: 15px 25px;
    }
    nav a {
      color: var(--brown);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
    }
    nav a:hover { text-decoration: underline; }
    .sun-space {
      position: relative;
      width: 105px;
      flex-shrink: 0;
      align-self: stretch;
    }
    .sun {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      width: 105px;
      height: 90px;
      color: var(--cream);
      text-decoration: none;
    }
    .sun svg { width: 100%; height: 100%; }
    .hero {
      min-height: calc(100vh - 82px);
      background:
        linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.22)),
        url("https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=2000&q=85")
        center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 25px;
      text-align: center;
    }
    .hero h1 {
      color: var(--cream);
      font-size: clamp(32px, 5vw, 70px);
      font-weight: normal;
      font-style: italic;
      max-width: 800px;
      line-height: 1.3;
    }
    .journal {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 25px;
      text-align: center;
    }
    .journal p {
      max-width: 520px;
      font-size: 24px;
      line-height: 1.7;
    }
    @media (max-width: 700px) {
      nav { flex-wrap: wrap; padding: 16px 10px; }
      nav a { font-size: 10px; }
      .sun-space { order: 3; width: 100%; height: 0; }
      .sun { top: 0; }
      .hero { min-height: 85vh; }
    }
  </style>
</head>
<body>
  <nav>

    <a href="workshops.html">WORKSHOPS / EVENTS</a>
    <a href="reciprocity.html">RECIPROCITY</a>

    <div class="sun-space">
      <a href="about.html" class="sun" aria-label="About">
        <svg viewBox="0 0 120 100"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M20 0 Q60 82 100 0 Z"
                fill="currentColor"/>
          <g stroke="currentColor"
             stroke-width="3" stroke-linecap="round">
            <path d="M16 32 L5 40 M27 53 L17 66
                     M44 70 L39 85 M60 78 L60 95
                     M76 70 L81 85 M93 53 L103 66
                     M104 32 L115 40"/>
          </g>
        </svg>
      </a>
    </div>

    <a href="mind-body-soul.html">MIND, BODY, & SOUL</a>
    <a href="inspiration.html">INSPIRATION</a>
  </nav>

  <main>
    <section class="hero">
      <h1>a softer way to be here.</h1>
    </section>

    <section class="journal">
      <p>
        A collection of places, people, and
        things that make us feel alive.
      </p>
    </section>
  </main>
</body>
</html>
