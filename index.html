
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sam's Journal</title>

  <style>
    :root {
      --cream: #F5F0E5;
      --brown: #493528;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: Georgia, serif;
    }

    /* NAVIGATION BAR */

    nav {
      position: relative;
      z-index: 10;
      background: var(--cream);
      height: 85px;
      display: grid;
      grid-template-columns:
        1fr 1fr 1fr 115px 1fr 1fr;
      align-items: center;
      gap: 12px;
      padding: 0 30px;
    }

    nav a {
      color: var(--brown);
      text-decoration: none;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      line-height: 1.5;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.55;
    }

    /* HANGING SUN */

    .sun-space {
      position: relative;
      width: 115px;
      height: 100%;
    }

    .sun {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 115px;
      height: 110px;
      color: var(--cream);
      z-index: 20;
      cursor: pointer;
    }

    .sun svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* FULL-SCREEN HOMEPAGE PHOTO */

    .hero {
      position: relative;
      min-height: calc(100vh - 85px);

      background:
        linear-gradient(
          rgba(0,0,0,0.08),
          rgba(0,0,0,0.18)
        ),
        url("https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=2000&q=85");

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 30px;
    }

    /* INTRODUCTORY SENTENCE */

    .hero h1 {
      color: var(--cream);
      font-size: clamp(32px, 5vw, 70px);
      font-weight: normal;
      font-style: italic;
      line-height: 1.3;
      max-width: 800px;
      margin: 0;
    }

    /* CREAM JOURNAL SECTION */

    .journal {
      min-height: 55vh;
      background: var(--cream);

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      padding: 80px 25px;
    }

    .journal p {
      max-width: 520px;
      font-size: 24px;
      line-height: 1.7;
      font-weight: normal;
    }

    /* MOBILE LAYOUT */

    @media (max-width: 700px) {

      nav {
        height: auto;
        min-height: 115px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto auto;
        gap: 18px 8px;
        padding: 15px 10px 20px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 0.5px;
      }

      .sun-space {
        grid-column: 2;
        grid-row: 2;
        justify-self: center;
        width: 90px;
        height: 0;
      }

      .sun {
        top: 0;
        width: 90px;
        height: 90px;
      }

      .hero {
        min-height: 85vh;
      }

      .hero h1 {
        font-size: 36px;
      }

      .journal p {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>

    <a href="retreats.html">
      RETREATS
    </a>

    <a href="workshops.html">
      WORKSHOPS<br>
      EVENTS
    </a>

    <a href="reciprocity.html">
      RECIPROCITY
    </a>

    <!-- CLICKABLE SUN / ABOUT PAGE -->

    <div class="sun-space">
      <a href="about.html"
         class="sun"
         aria-label="About">

        <svg viewBox="0 0 120 110"
             xmlns="http://www.w3.org/2000/svg">

          <g fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round">

            <!-- SEMICIRCLE OUTLINE -->

            <path d="M12 0 Q60 92 108 0"/>

            <!-- SUN RAYS -->

            <path d="
              M13 25 L2 32
              M25 52 L13 65
              M44 76 L38 94
              M60 88 L60 107
              M76 76 L82 94
              M95 52 L107 65
              M107 25 L118 32
            "/>

          </g>
        </svg>

      </a>
    </div>

    <a href="mind-body-soul.html">
      MIND, BODY, & SOUL
    </a>

    <a href="inspiration.html">
      INSPIRATION
    </a>

  </nav>

  <!-- HOMEPAGE PHOTOGRAPH -->

  <main>

    <section class="hero">

      <h1>
        a softer way to be here.
      </h1>

    </section>

    <!-- CREAM SECTION BELOW PHOTO -->

    <section class="journal">

      <p>
        A collection of places, people,
        and things that make us feel alive.
      </p>

    </section>

  </main>

</body>
</html>
